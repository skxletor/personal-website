<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FCFCFC">
    <title>Under Construction | Justin Richardson</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../imgs/tempfavicon.png">
    <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#111111':'#FCFCFC';})();</script>
    <script src="../theme.js"></script>
    <script src="../bg-sync.js"></script>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <!-- Mobile Safari edge gradients -->
    <div class="safari-grad safari-grad-top"></div>

    <header id="header">
        <a href="../" class="brand">JR</a>
        <nav id="nav">
            <a href="../home/">Home</a>
            <a href="../projects/">Projects</a>
            <a href="../resume/">Resume</a>
            <a href="../login/">Partner Login</a>
            <a href="../contact/">Contact</a>
        </nav>
    </header>

    <main class="construction-page">

        <div class="caution">
            <img src="../imgs/caution.gif" alt="">
            <p>Under Construction</p>
        </div>

        <p class="construction-note">
            The resume isn't up yet. In the meantime, take a look at my
            <a href="../projects/" class="bio-link">projects</a> or
            <a href="../contact/" class="bio-link">get in touch</a> for a copy.
        </p>

    </main>

    <style>
        .construction-page {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 50px clamp(24px, 6vw, 100px);
            box-sizing: border-box;
            text-align: center;
        }

        /* .caution is a bare flex row in style.css — line the gif up with the
           text and keep it from dominating the page */
        .caution {
            align-items: center;
            gap: clamp(12px, 2vw, 24px);
            flex-wrap: wrap;
        }

        .caution img {
            width: clamp(80px, 12vw, 130px);
            height: auto;
        }

        .construction-note {
            max-width: 460px;
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(13px, 1.6vw, 15px);
            font-weight: 300;
            line-height: 1.8;
            color: var(--text);
            opacity: 0.45;
            margin: 0;
        }
    </style>

    <!-- Footer -->
    <footer class="site-footer">
        <span class="footer-copy">&copy; 2026 Justin Richardson</span>
        <div class="footer-links">
            <a href="https://www.linkedin.com/in/justin-richardson-84366b384/" target="_blank" rel="noopener">LinkedIn</a>
            <a href="../contact/">Contact</a>
        </div>
    </footer>

    <script src="../topo-mesh.js"></script>
</body>
</html>
